# yaml-language-server: $schema=../src/content/game.schema.json
#
# MODÈLE DE JEU — à copier pour ajouter un jeu à MastersCards, sans toucher au code.
#
# 1. Crée le dossier src/content/games/<id>/ (id en minuscules, avec des tirets : « mon-jeu »).
# 2. Copie ce fichier dedans sous le nom game.yaml, puis remplace chaque valeur.
#    Ligne 1 : remplace le chemin du schéma par ../../game.schema.json (VS Code complète alors les champs,
#    avec l'extension « YAML » de Red Hat).
# 3. Facultatif : dépose dans le même dossier un logo (svg ou png, original ou redessiné, jamais le logo officiel)
#    et une police pour le nom (woff2, sous licence libre, avec son fichier de licence).
# 4. Lance `npm test` : il vérifie le schéma, les cartes, le contraste, le tutoiement et la longueur des phrases.
#    Le jeu apparaît ensuite tout seul sur l'accueil, avec les mêmes écrans que les autres.
#
# Règles d'écriture : tutoiement, phrases courtes (22 mots au plus), français.
# Un texte qui contient « : », « # » ou commence par un chiffre se met entre apostrophes droites : '7'.
# Évite les accolades { } autour d'un texte qui contient une virgule : écris plutôt une clé par ligne.
# Dans tous les textes, {cards} est remplacé par le nombre de cartes gardées (calculé).

# --- Identité --------------------------------------------------------------------------------------------------

id: mon-jeu # = nom du dossier, sert dans l'adresse (/jeu/mon-jeu)
name: Mon jeu # 40 caractères au plus

# Police du nom (facultatif ; défaut : Fredoka, la police de titre de l'app).
# font:
#   file: ma-police.woff2 # fichier du dossier du jeu
#   family: Ma Police
#   weight: 400
#   band_size: 4 # taille du nom dans le bandeau, en multiples de 16 px (défaut 3,5)

# Couleurs. Seule main_color est obligatoire ; chaque autre champ remplace un calcul.
#
# main_color : la couleur du jeu (le « tapis ») : tuile de l'accueil, bandeau, écran de partie. Un nom de la charte
#   (jaune, vert, rouge, bleu) ou une couleur libre '#RRGGBB'. Le texte dessus (blanc ou encre) est choisi seul ;
#   une couleur sans contraste suffisant est refusée.
main_color: bleu
# shadow_color: '#0E2F86' # relief de main_color (défaut : main_color assombri)
# text_color: '#FFFFFF' # texte sur main_color ; contraste d'au moins 4,5, sinon refusé

# background_color : le fond de TOUS les écrans du jeu, à la place du bleu de l'app (un dégradé discret en est tiré).
#   Avec lui, les pastilles et bascules prennent main_color. Sans lui, le jeu garde le bleu.
# background_color: '#EEDDC8'
# background_text_color: '#14213D' # texte sur ce fond (défaut : blanc ou encre, choisi seul ; contraste d'au moins 4,5)

# Dos des cartes (pioche, cartes posées de dos) : un nom de la charte ou '#RRGGBB'. Défaut : main_color.
# card_back_color: '#E57979'

# logo: logo.svg # facultatif ; défaut : l'initiale du nom dans un rond blanc

tagline: Une phrase d’accroche courte. # en gras sur la page du jeu
description: >-
  Trois ou quatre phrases courtes qui donnent envie de jouer. Elles suivent la phrase d’accroche.

players: { min: 2, max: 5 }
duration_min: 15 # filtre « Rapide » de l'accueil : 15 minutes ou moins

# Mot qui numérote la vue à balayer : « Groupe 2 / 6 » (défaut) ou, par exemple, « Carte 2 / 8 ».
# group_word: Carte

# Mots du jeu d'origine à ne jamais écrire en mode Classique (vérifié par `npm test`). Facultatif.
# classic_forbidden_terms: [Dragon, Chevalier]

# --- Cartes à garder et correspondances ------------------------------------------------------------------------
#
# Chaque groupe = une ligne de l'écran « Tes cartes » = une page de la vue à balayer.
# cards : les cartes du paquet de 52 à garder dans ce groupe (facultatif si le groupe est fait de jokers). Rangs : A, 2 à 10, J (valet), Q (dame), K (roi).
#         Couleurs : spades (pique), hearts (cœur), diamonds (carreau), clubs (trèfle), ou all (les quatre).
# jokers : nombre de jokers du groupe (facultatif). Le paquet de 52 n'en a pas : on prend ceux de la boîte, 2 au plus.
#         Un groupe de jokers seul s'écrit sans `cards` : `jokers: 2` et `display: { joker: true }`.
#         Le bandeau dit alors « Garde ces 21 cartes, dont 2 jokers. Retire tout le reste du paquet. ».
# Le nombre de cartes et le bandeau « Retire… Garde… » sont calculés : rien à écrire.
# expert : la correspondance avec le jeu d'origine, montrée en mode Connaisseur.
#   expert.cards (facultatif) : les cartes d'origine, 1 à 5 par groupe : { value, name?, color, image? }.
#     Sans `image`, la carte est DESSINÉE (valeur sur fond de couleur, sans portrait ni texte officiel) :
#       cards: [{ value: '7', name: Roi, color: '#606D73' }]
#     Avec `image: carte-07.webp` (fichier du dossier du jeu, svg, png ou webp), la carte EST l'image, chiffre compris :
#       une image dont tu as les droits, jamais une illustration officielle. Pour découper une planche de cartes :
#       `npm run planche -- planche.png src/content/games/<id> carte` (carte-01.webp, carte-02.webp… à fond transparent).
#     Dans les deux cas, `color` doit porter `value` en blanc ou en encre (contraste d'au moins 4,5 : vérifié par `npm test`).
#     Sans `cards`, une carte en pointillés.

card_groups:
  - label: As # titre de la ligne
    cards:
      - ranks: [A]
        suits: all
    display: { rank: A, suit: hearts } # carte montrée d'un groupe d'un seul rang ; facultatif (défaut : la première carte). Un groupe de plusieurs rangs montre une « main » de 2 ou 3 cartes, calculée (8-9-10, 2-4-6)
    short: Vaut 1. # ligne 2 de la liste : la valeur ou le pouvoir, une trentaine de caractères au plus
    badge: Spécial # pastille à côté du titre ; facultatif
    detail: # explication de la vue à balayer
      title: L’As vaut 1.
      text: C’est la carte la plus basse.
    expert:
      original: '1' # carte(s) du jeu d'origine
      name: Dragon # nom d'origine ; facultatif
      power: rien n’arrête le dragon # pouvoir d'origine, en une proposition ; facultatif
      cards: [{ value: '1', name: Dragon, color: '#C0392B' }] # facultatif : la carte d'origine, dessinée

  - label: 2 à 6
    cards:
      - ranks: [2, 3, 4, 5, 6]
        suits: [spades, hearts]
      - ranks: [7]
        suits: [clubs] # plusieurs lignes quand les couleurs diffèrent selon le rang
    short: Valent leur chiffre.
    detail:
      title: Chaque carte vaut son chiffre.
      text: Garde les plus fortes pour la fin.
    expert:
      original: 2–6

# --- Partie et scores -------------------------------------------------------------------------------------------
#
# Tous les jeux se marquent pareil : à chaque saisie, on note les points gagnés ; « Valider » les ajoute
# et passe à la manche suivante. {round} = numéro de la manche.

scoring:
  unit: point # ce qu'on compte, au singulier (lu par les lecteurs d'écran : « Un point de plus pour Léa »)
  party_label: Manche {round} # en haut à droite de la partie en cours
  title: Fin de la manche {round} # titre de l'écran de saisie
  question: Qui a gagné des points ?
  validate: Valider la manche
  target: 5 # score qui termine la partie ; ou par nombre de joueurs : { 2: 7, 3: 5, 4: 4, 5: 3 } ; facultatif
  # lowest_wins: true # le plus petit score gagne (6 qui prend) : podium et historique classés dans l'autre sens

# --- Tutoriel ----------------------------------------------------------------------------------------------------

tutorial:
  setup:
    title: Mise en place
    # La table vue de haut : quatre mains de dos autour, ce qui se pose au centre au milieu.
    hand: # ta main, légendée ; les trois autres mains prennent la même disposition
      label: Ta main
      layout: spread # single (une carte, défaut) | spread (une main en éventail)
    center: # 1 à 3 éléments : des cartes de dos ; ou une carte visible si `card` est donné
      - label: Pioche
        layout: pile # single (une carte, défaut) | pile (la pioche) | spread (un éventail) | grid (des cartes alignées, 3 x 2)
      - label: Défausse
        card: { rank: 5, suit: hearts }
      # Des rangées de cartes visibles, l'une sous l'autre (2 à 5) : `cards`, sans `layout` ni `card`. `slots` (facultatif) :
      # les places de chaque rangée, la carte puis des emplacements vides en pointillés. Ex. les rangées de 6 qui prend :
      # - label: '4 rangées'
      #   slots: 5
      #   cards: [{ rank: 3, suit: clubs }, { rank: 9, suit: hearts }, { rank: Q, suit: spades }, { rank: 6, suit: diamonds }]
    steps:
      - Mélange les {cards} cartes.
      - Donne 5 cartes à chaque joueur.
      - Le reste forme la pioche.
  turn:
    title: Un tour de jeu
    reveal: # facultatif : la table de la mise en place, à l'identique, avec ces cartes retournées
      hand: [{ rank: 5, suit: hearts }, { rank: Q, suit: hearts }] # ta main pendant le tour, de face (1 à 3 cartes)
      across: { rank: A, suit: spades } # la carte du bord de la main d'en face
      center: [{ rank: 4, suit: hearts }] # une carte par élément du centre, dans l'ordre
      played: { left: { rank: 2, suit: hearts } } # la carte découverte à côté de la main d'un joueur (across, left, right ; you : la tienne)
    steps:
      - label: Pioche.
        text: Prends la carte du dessus.
      - label: Joue.
        text: Pose une carte devant toi.
    win:
      title: Gagner
      text: Sois le premier à 5 points.

# --- Règles complètes -------------------------------------------------------------------------------------------

full_rules:
  - title: But
    text: Sois le premier à 5 points.
  - title: Mise en place
    text: '{cards} cartes. Donne 5 cartes à chaque joueur. Le reste forme la pioche.'
