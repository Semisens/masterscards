# yaml-language-server: $schema=../../game.schema.json
# Love Letter : configuration complète du jeu. Modèle commenté : docs/modele-jeu.yaml.

id: love-letter
name: Love Letter
font: { file: great-vibes.woff2, family: Great Vibes, weight: 400, band_size: 4 }
# Palette : bordeaux (couleur du jeu), brun (son relief), crème (son texte, et le fond des écrans), corail (dos des cartes).
main_color: '#812B2B'
shadow_color: '#400E0E'
text_color: '#EEDDC8'
background_color: '#EEDDC8'
card_back_color: '#E57979'
logo: logo.png # sceau de cire cramoisi et enveloppe dorée (image fournie par l'utilisateur, détourée)
tile_color: '#EEDDC8' # vignette de l'accueil en crème : le sceau se fondrait dans le bordeaux
tagline: Une lettre. Une princesse. Un seul gagnant.
description: >-
  Tu gardes une seule carte en main. Chaque tour, tu en piocheras une autre et tu joues l’une des deux. Devine,
  observe, élimine tes rivaux. Fais parvenir ta lettre avant les autres.
players: { min: 2, max: 6 }
duration_min: 20
group_word: Carte
classic_forbidden_terms: [Espionne, Garde, Prêtre, Baron, Servante, Chancelier, Comtesse]

# Cartes à garder (21) : les 10 personnages de l'édition 2019, valeur = rang.
# Espionne = les 2 jokers, Garde = 4 valets et 2 rois noirs, Princesse = la dame de cœur.
# Une ligne de « Tes cartes » par personnage.
card_groups:
  - label: Jokers
    jokers: 2
    short: Peut remporter 1 point.
    detail:
      title: Peut remporter 1 point.
      text: >-
        Rien ne se passe quand tu en joues un. En fin de manche, tu marques 1 point si tu es en jeu et seul à avoir un
        joker devant toi.
    expert:
      original: '0'
      name: Espionne
      cards:
        - { value: '0', name: Espionne, color: '#6C767A' }
      power: marquer un point en fin de manche si l’on est en vie et seul à en avoir une devant soi

  - label: Valets et rois noirs
    cards:
      - { ranks: [J], suits: all }
      - { ranks: [K], suits: [spades, clubs] }
    display: { rank: J, suit: hearts }
    short: Devine la carte d’un rival.
    detail:
      title: Devine la carte d’un rival.
      text: Choisis un rival. Dis une valeur, sauf 1. S’il a cette carte, il est éliminé.
    expert:
      original: '1'
      name: Garde
      cards:
        - { value: '1', name: Garde, color: '#E0271D' }
      power: deviner la carte d’un joueur pour l’éliminer

  - label: '2'
    cards:
      - { ranks: [2], suits: [hearts, spades] }
    display: { rank: 2, suit: spades }
    short: Regarde sa main.
    detail:
      title: Regarde sa main.
      text: Choisis un rival. Il te montre sa carte. Ne la répète à personne.
    expert:
      original: '2'
      name: Prêtre
      cards:
        - { value: '2', name: Prêtre, color: '#65B049' }
      power: voir la main d’un joueur

  - label: '3'
    cards:
      - { ranks: [3], suits: [hearts, spades] }
    display: { rank: 3, suit: hearts }
    short: Compare. La plus faible sort.
    detail:
      title: Compare. La plus faible sort.
      text: >-
        Choisis un rival. Compare ta carte en main avec la sienne, en secret. La plus faible est éliminée. Égalité :
        personne ne sort.
    expert:
      original: '3'
      name: Baron
      cards:
        - { value: '3', name: Baron, color: '#069FD1' }
      power: comparer sa main avec celle d’un joueur

  - label: '4'
    cards:
      - { ranks: [4], suits: [hearts, spades] }
    display: { rank: 4, suit: spades }
    short: Tu es protégé un tour.
    detail:
      title: Tu es protégé un tour.
      text: Jusqu’à ton prochain tour, personne ne peut te choisir. Les pouvoirs des autres cartes ne t’atteignent pas.
    expert:
      original: '4'
      name: Servante
      cards:
        - { value: '4', name: Servante, color: '#7A31A2' }
      power: être protégé jusqu’à son prochain tour

  - label: '5'
    cards:
      - { ranks: [5], suits: [hearts, spades] }
    display: { rank: 5, suit: hearts }
    short: Un joueur défausse sa carte.
    detail:
      title: Un joueur défausse sa carte.
      text: >-
        Choisis un joueur, toi compris. Il défausse sa carte et en pioche une nouvelle. Si c’est la dame de cœur, il
        est éliminé. Pioche vide : il prend la carte écartée.
    expert:
      original: '5'
      name: Prince
      cards:
        - { value: '5', name: Prince, color: '#FC9913' }
      power: faire défausser la carte d’un joueur

  - label: '6'
    cards:
      - { ranks: [6], suits: [hearts, spades] }
    display: { rank: 6, suit: spades }
    short: Pioche 2 cartes, choisis-en 1.
    detail:
      title: Pioche deux cartes, choisis-en une.
      text: Pioche les deux cartes du dessus. Choisis-en une pour ta main. Remets les deux autres sous la pioche, dans l’ordre de ton choix.
    expert:
      original: '6'
      name: Chancelier
      cards:
        - { value: '6', name: Chancelier, color: '#00B6B3' }
      power: piocher deux cartes, en garder une

  - label: '7'
    cards:
      - { ranks: [7], suits: [hearts] }
    short: Échange ta main.
    detail:
      title: Échange ta main.
      text: Choisis un rival. Échange ta carte contre la sienne, en secret.
    expert:
      original: '7'
      name: Roi
      cards:
        - { value: '7', name: Roi, color: '#606D73' }
      power: échanger sa main avec celle d’un joueur

  - label: '8'
    cards:
      - { ranks: [8], suits: [spades] }
    short: À jouer avec le 5 ou le 7.
    detail:
      title: À jouer avec le 5 ou le 7.
      text: Si tu as aussi un 5 ou un 7 en main, tu dois jouer le 8. Il n’a aucun autre effet.
    expert:
      original: '8'
      name: Comtesse
      cards:
        - { value: '8', name: Comtesse, color: '#AF39A8' }
      power: devoir être jouée avec le Prince ou le Roi

  - label: Dame de cœur
    cards:
      - { ranks: [Q], suits: [hearts] }
    short: Si tu la défausses, tu sors.
    detail:
      title: Si tu la défausses, tu sors.
      text: >-
        Conserve-la jusqu’à la fin. Si tu la joues ou la défausses, pour quelque raison que ce soit, tu es éliminé.
    expert:
      original: '9'
      name: Princesse
      cards:
        - { value: '9', name: Princesse, color: '#D72865' }
      power: éliminer celui qui la joue ou la défausse

# Partie en manches : le gagnant d'une manche marque 1 point (2 au plus, avec les jokers). Le premier à 6, 5, 4, 3
# ou 3 points gagne, à 2, 3, 4, 5 ou 6 joueurs.
scoring:
  unit: point
  party_label: Manche {round}
  title: Fin de la manche {round}
  question: Qui a gagné des points ?
  validate: Valider la manche
  target: { 2: 6, 3: 5, 4: 4, 5: 3, 6: 3 }

tutorial:
  setup:
    title: Mise en place
    hand: { label: Ta main, layout: single }
    center:
      - { label: Pioche, layout: pile }
      - { label: 'Écartée, cachée', layout: single }
    steps:
      - Mélange les {cards} cartes.
      - Écarte la première, face cachée.
      - Donne 1 carte à chaque joueur.
      - Le reste forme la pioche.
  turn:
    title: Un tour de jeu
    reveal: # la table de la mise en place : ta main de 2 cartes, de face, et une carte jouée devant deux autres joueur
      hand: [{ rank: 5, suit: hearts }, { rank: Q, suit: hearts }]
      played:
        across: { rank: 3, suit: spades }
        right: { rank: J, suit: clubs }
    steps:
      - label: Pioche.
        text: Prends la carte du dessus.
      - label: Joue.
        text: Pose une de tes deux cartes, face visible.
      - label: Applique.
        text: Fais ce que dit la carte.
      - label: Passe.
        text: C’est au joueur suivant.
    win:
      title: Gagner la manche
      text: >-
        Sois le dernier en jeu. Ou aie la plus forte carte quand la pioche est vide. Seul à avoir un joker devant toi, et
        encore en jeu : 1 point de plus.

full_rules:
  - title: But
    text: >-
      Marque des points, manche après manche. Le premier qui atteint le score visé gagne : 6 points à 2 joueurs, 5 à 3
      joueurs, 4 à 4 joueurs, 3 à 5 ou 6 joueurs.
  - title: Valeurs des cartes
    text: 'Joker : 0. Valets et rois noirs : 1. Cartes de 2 à 8 : leur chiffre. Dame de cœur : 9.'
  - title: Mise en place
    text: >-
      Mélange les {cards} cartes. Écarte la première, face cachée. Donne une carte à chaque joueur. Le reste forme la
      pioche.
  - title: Un tour
    text: >-
      Pioche, puis joue une de tes deux cartes devant toi. Son pouvoir s’applique. Au premier tour, le dernier à avoir
      écrit une lettre commence. Ensuite, le gagnant de la manche précédente commence.
  - title: Fin de manche
    text: >-
      La manche s’arrête quand il ne reste qu’un joueur en jeu, ou quand la pioche est vide. Le dernier en jeu marque 1
      point. Pioche vide : la plus forte carte marque 1 point. Égalité : chacun marque 1 point.
  - title: Jokers
    text: >-
      À la fin de la manche, tu marques 1 point de plus si tu es encore en jeu. Il faut aussi être le seul à avoir un
      joker devant toi. Si un autre joueur en a un, personne ne marque. Une manche rapporte donc 2 points au plus.
